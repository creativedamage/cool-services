<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Sundays app icon: a countdown ring around a live dot. macOS grid: 824×824 body, 100 px margin. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13233A"/>
      <stop offset="1" stop-color="#060D17"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FB1FF"/>
      <stop offset="1" stop-color="#2F7BFF"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FF7A86"/>
      <stop offset="1" stop-color="#F0384A"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF4D5E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF4D5E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>
  <!-- ring: track, then about three quarters left on the countdown -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="#1C2C44" stroke-width="64"/>
  <path d="M512 262 A250 250 0 1 1 295.5 637" fill="none" stroke="url(#arc)" stroke-width="64" stroke-linecap="round"/>
  <!-- live dot -->
  <circle cx="512" cy="512" r="150" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="96" fill="none" stroke="#FF4D5E" stroke-opacity="0.35" stroke-width="14"/>
  <circle cx="512" cy="512" r="62" fill="url(#dot)"/>
</svg>
