# Builds the Mac app and publishes a GitHub Release whenever a version tag (v1.7.1 …) is pushed.
# Sundays' "Check for Updates" reads the newest release from here.
#
# Start one with:  npm run release -- 1.7.1
name: Release
# Shows as "Sundays 1.18.3 — <summary>" (the release commit) in the Actions list.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Rebuild {0}', github.event.inputs.tag) || github.event.head_commit.message }}

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.7.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 150
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the tag's version
        run: |
          V="${TAG#v}"
          node -e 'const fs=require("fs");const f="desktop/package.json";const p=JSON.parse(fs.readFileSync(f));p.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n")' "$V"
          node -e 'const p=require("./desktop/package.json");if(!p.sundays||!p.sundays.updateRepo||p.sundays.updateRepo.startsWith("YOUR-")){console.error("Run: npm run set-repo -- <github-name>/<repo> and commit it");process.exit(1)}'
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      # Optional: the church's own signing certificate (see README → Updates). Without it the app
      # is signed ad hoc, which works the same but macOS asks about the Keychain after each update.
      - name: Signing certificate
        if: env.MAC_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/sundays.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          SHA=$(security find-certificate -c "Sundays" -Z "$KC" | awk '/SHA-1 hash/{print $3; exit}')
          echo "COOL_SIGN_IDENTITY=$SHA" >> "$GITHUB_ENV"
          echo "COOL_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      # Every Sundays app (shared/apps.ts): Sundays, Operations and AVL (and a farewell build of each retired app, zip only, in every release).
      - name: Build the Mac apps
        run: npm run dist:mac

      - name: Checksums
        working-directory: desktop/release
        run: |
          ls -la
          shasum -a 256 Sundays*.dmg Sundays*-mac.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          node -e '
            const fs = require("fs"); const v = process.env.VERSION;
            const log = fs.existsSync("CHANGELOG.md") ? fs.readFileSync("CHANGELOG.md", "utf8") : "";
            const sec = log.split(/^## /m).find((x) => x.startsWith(v + "\n")) || "";
            const lines = sec.split("\n").slice(1);
            const summary = (lines.find((l) => l.trim() && !l.startsWith("-")) || "").trim().replace(/\.$/, "");
            const body = lines.filter((l) => l.trim() !== summary + "." && l.trim() !== summary).join("\n").trim();
            fs.writeFileSync("release-notes.md", (summary ? summary + ".\n\n" : "") + body + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "SUMMARY=" + (summary || "Sundays " + v) + "\n");
          '
          cat release-notes.md

      # The full app's files go up first: Sundays 1.27 and older update from the first "-mac.zip" in
      # the release, so it must be the full app's. (Newer versions look for their own by name.)
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Sundays ${{ env.VERSION }} — ${{ env.SUMMARY }}
          body_path: release-notes.md
          files: |
            desktop/release/Sundays-${{ env.VERSION }}-mac.zip
            desktop/release/Sundays-${{ env.VERSION }}.dmg
            desktop/release/SHA256SUMS.txt

      - name: Add the separate apps
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            desktop/release/Sundays-*-${{ env.VERSION }}.dmg
            desktop/release/Sundays-*-${{ env.VERSION }}-mac.zip
