services:
  micboard:
    build: .
    image: micboard
    container_name: micboard
    restart: unless-stopped
    # Host networking is required for Shure device discovery (multicast)
    # and is the simplest way to reach receivers on the local network.
    # Comment out `network_mode` and use `ports` instead if you only
    # configure devices by IP (works on Docker Desktop for Mac/Windows).
    network_mode: host
    # ports:
    #   - '8058:8058'
    volumes:
      - ./config:/root/.local/share/micboard
